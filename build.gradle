/* ~~~ Gradle Configuration ~~~ */

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'application'
}

group = 'de.htw-berlin'
version = '0.0.1-SNAPSHOT'

/* ~~~ Java Configuration ~~~ */

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.bbot:spring-boot-starter-mail'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/* ~~~ Application Configuration ~~~ */

application {
  mainClass = 'de.htwberlin.archivewizard.ArchiveWizardApplication'
}

def secrets = [
  dbHost: findProperty("dbHost") ?: System.getenv("DB_HOST"),
  dbPort: findProperty("dbPort") ?: System.getenv("DB_PORT"),
  dbName: findProperty("dbName") ?: System.getenv("DB_NAME"),
  dbUsername: findProperty("dbUsername") ?: System.getenv("DB_USERNAME"),
  dbPassword: findProperty("dbPassword") ?: System.getenv("DB_PASSWORD")
]

/* ~~~ Task Configuration ~~~ */

tasks.withType(JavaExec).configureEach {
  systemProperties secrets
}

tasks.withType(Test).configureEach {
  systemProperties secrets
}

tasks.named('test') {
	useJUnitPlatform()
}